name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check-test:
    name: CI / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2022
          - windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Release and privacy audit
        run: npm run audit:release

      - name: Install ffmpeg-static binary
        run: npm rebuild ffmpeg-static

      - name: Build
        run: npm run build

      - name: Check
        run: npm run check

      - name: Install search tools
        shell: pwsh
        run: choco install fd ripgrep --yes --no-progress

      - name: Test
        run: npm test
