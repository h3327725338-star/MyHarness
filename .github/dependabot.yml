# The built-in browser of the desktop host is Electron's Chromium. Dependencies are pinned to exact versions, so the
# engine only moves when this opens a pull request for a new Electron release (CI then runs on it as usual).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    allow:
      - dependency-name: electron
    versioning-strategy: increase
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(desktop)"
